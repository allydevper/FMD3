[package]
name = "fmd-mvp"
version = "0.1.0"
description = "FMD MVP host: Tauri + Lua modules"
authors = ["FMD3"]
edition = "2021"
default-run = "fmd-mvp"

[lib]
name = "fmd_mvp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fmd-mvp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "brotli", "rustls-tls"] }
base64 = "0.22"
url = "2"
scraper = "0.23"
ego-tree = "0.10"
regex = "1"
thiserror = "2"
parking_lot = "0.12"
sanitize-filename = "0.6"
once_cell = "1"
